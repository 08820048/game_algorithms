<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo · 游戏算法图解</title>
  <style>
    /* 与网站 src/styles/custom.css 的 --ga-* 变量保持一致 */
    :root {
      --raised: #fbf9f4; --ink: #1a1915; --muted: #8a8478; --rule: #e2ddd1;
      --hover: #efebe2; --vermilion: #c8402a;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    html[data-theme="dark"] {
      --raised: #1b1a17; --ink: #ece7dc; --muted: #8f897d; --rule: #2c2a26;
      --hover: #24221f; --vermilion: #e8664a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--raised); color: var(--ink);
      font: 12px/1.4 var(--mono); -webkit-font-smoothing: antialiased; }
    #stage { position: relative; }
    #canvas { display: block; width: 100%; height: auto; touch-action: none; outline: none; }
    #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--muted); background: var(--raised); letter-spacing: 0.08em; }
    #overlay[hidden] { display: none; }

    #toolbar { display: flex; align-items: stretch; border-top: 1px solid var(--ink); min-height: 40px; }
    .group { display: flex; align-items: stretch; }
    button { flex-shrink: 0; white-space: nowrap; font: inherit; color: var(--ink); background: transparent; border: 0;
      border-right: 1px solid var(--rule); padding: 0 14px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; letter-spacing: 0.04em; }
    button:hover:not(:disabled) { background: var(--hover); }
    button:disabled { color: var(--muted); cursor: default; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--vermilion); outline-offset: -2px; }
    #play { min-width: 76px; }
    #play .icon { display: inline-block; width: 8px; height: 10px; }
    #play[data-state="playing"] .icon { border-left: 3px solid currentColor; border-right: 3px solid currentColor; }
    #play:not([data-state="playing"]) .icon { border-left: 8px solid var(--vermilion);
      border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
    kbd { font: inherit; color: var(--muted); }

    .speed { flex-shrink: 0; white-space: nowrap; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-right: 1px solid var(--rule);
      color: var(--muted); }
    input[type="range"] { -webkit-appearance: none; appearance: none; width: 96px; height: 16px; background: transparent; }
    input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--ink); }
    input[type="range"]::-moz-range-track { height: 1px; background: var(--ink); }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 9px; height: 9px; margin-top: -4px;
      background: var(--vermilion); border: 0; border-radius: 0; }
    input[type="range"]::-moz-range-thumb { width: 9px; height: 9px; background: var(--vermilion); border: 0; border-radius: 0; }
    #speedValue { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 3.5em; }

    #status { margin-left: auto; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 14px;
      color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    #status .text { overflow: hidden; text-overflow: ellipsis; }
    #status .dot { width: 6px; height: 6px; background: var(--muted); flex-shrink: 0; }
    #status[data-state="playing"] .dot { background: var(--vermilion); }
    #status[data-state="finished"] .dot { background: var(--ink); }

    @media (max-width: 560px) {
      #toolbar { flex-wrap: wrap; }
      #status { width: 100%; border-top: 1px solid var(--rule); min-height: 32px; margin-left: 0; }
      .speed { border-right: 0; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="overlay">LOADING…</div>
  </div>
  <div id="toolbar">
    <div class="group">
      <button id="play" type="button" disabled><span class="icon" aria-hidden="true"></span><span class="label">播放</span></button>
      <button id="step" type="button" disabled>单步</button>
      <button id="reset" type="button" disabled>重置</button>
    </div>
    <label class="speed">速度
      <input id="speed" type="range" min="-3" max="5" step="1" value="0" disabled aria-label="执行速度">
      <span id="speedValue">1×</span>
    </label>
    <div id="status" aria-live="polite"><span class="dot"></span><span class="text"></span></div>
  </div>

  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var playBtn = $('play'), stepBtn = $('step'), resetBtn = $('reset');
      var speedInput = $('speed'), speedValue = $('speedValue'), status = $('status');
      var statusText = status.querySelector('.text');
      var ready = false, lastDetail = '', lastState = '已暂停';

      // ---- 主题：嵌入在文章里时跟随父页面（Starlight 的 data-theme），单独打开时跟随系统 ----
      function parentRoot() {
        try { return window.parent !== window ? window.parent.document.documentElement : null; }
        catch (e) { return null; }
      }
      function currentTheme() {
        var root = parentRoot();
        if (root && root.dataset.theme) return root.dataset.theme;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      function applyTheme() {
        var theme = currentTheme();
        document.documentElement.dataset.theme = theme;
        if (Module._demo_set_theme) Module._demo_set_theme(theme === 'dark' ? 1 : 0);
      }
      var root = parentRoot();
      if (root) new MutationObserver(applyTheme).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

      // ---- 自适应高度：让父页面的 iframe 正好包住内容 ----
      function fitFrame() {
        try {
          if (window.frameElement) window.frameElement.style.height = document.body.scrollHeight + 'px';
        } catch (e) {}
      }
      new ResizeObserver(fitFrame).observe(document.body);

      // ---- 工具栏 ----
      function speedFromSlider() { return Math.pow(2, Number(speedInput.value)); }
      function formatSpeed(s) { return s >= 1 ? s + '×' : '1/' + Math.round(1 / s) + '×'; }
      function renderStatus() { statusText.textContent = lastDetail ? lastDetail : lastState; }
      playBtn.onclick = function () { Module._demo_toggle_play(); };
      stepBtn.onclick = function () { Module._demo_step(); };
      resetBtn.onclick = function () { Module._demo_reset(); };
      speedInput.oninput = function () {
        var s = speedFromSlider();
        speedValue.textContent = formatSpeed(s);
        Module._demo_set_speed(s);
      };

      // ---- 不在视口内时暂停主循环 ----
      var visible = true;
      new IntersectionObserver(function (entries) {
        var v = entries[0].isIntersecting;
        if (v === visible) return;
        visible = v;
        if (ready) Module._demo_set_visible(v ? 1 : 0);
      }).observe(document.body);

      window.Module = {
        canvas: $('canvas'),
        print: function (t) { console.log(t); },
        printErr: function (t) { console.warn(t); },
        onRuntimeInitialized: function () {
          applyTheme();
          Module._demo_set_speed(speedFromSlider());
        },
        // 以下两个回调由 C++ 侧（cpp/common/demo.cpp）在状态变化时调用
        onDemoState: function (playing, finished) {
          if (!ready) {
            ready = true;
            $('overlay').hidden = true;
            [playBtn, stepBtn, resetBtn, speedInput].forEach(function (el) { el.disabled = false; });
            if (!visible) Module._demo_set_visible(0);
          }
          playBtn.dataset.state = playing ? 'playing' : 'paused';
          playBtn.querySelector('.label').textContent = playing ? '暂停' : (finished ? '重播' : '播放');
          status.dataset.state = finished ? 'finished' : (playing ? 'playing' : 'paused');
          lastState = finished ? '已完成' : (playing ? '运行中' : '已暂停');
          renderStatus();
        },
        onDemoStatus: function (text) {
          lastDetail = text;
          renderStatus();
        },
      };
      window.addEventListener('error', function () {
        $('overlay').textContent = '演示加载失败：浏览器可能不支持 WebGL / WebAssembly';
      });
      applyTheme();
    })();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
