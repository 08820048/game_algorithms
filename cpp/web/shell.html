<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo</title>
  <style>
    :root {
      --bg: #fafaf7; --fg: #202228; --muted: #6b6e78; --border: #e2e2dc;
      --btn: #ffffff; --btn-hover: #f0f0ea; --accent: #2a7de1;
    }
    html[data-theme="dark"] {
      --bg: #17191f; --fg: #e6e8ee; --muted: #8c919e; --border: #2c2f38;
      --btn: #22252d; --btn-hover: #2c3039; --accent: #6aa8ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg);
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    #stage { position: relative; }
    #canvas { display: block; width: 100%; height: auto; touch-action: none; outline: none; }
    #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--muted); background: var(--bg); }
    #overlay[hidden] { display: none; }
    #toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      padding: 8px 10px; border-top: 1px solid var(--border); }
    button { font: inherit; color: var(--fg); background: var(--btn); border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 10px; cursor: pointer; min-width: 64px; }
    button:hover { background: var(--btn-hover); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    label { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; color: var(--muted); }
    input[type="range"] { width: 110px; accent-color: var(--accent); }
    #speedValue { font-variant-numeric: tabular-nums; min-width: 3.2em; }
    #status { margin-left: auto; color: var(--muted); }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="overlay">加载中…</div>
  </div>
  <div id="toolbar">
    <button id="play" type="button" disabled>暂停</button>
    <button id="step" type="button" disabled>单步</button>
    <button id="reset" type="button" disabled>重置</button>
    <label>速度
      <input id="speed" type="range" min="-3" max="5" step="1" value="0" disabled>
      <span id="speedValue">1×</span>
    </label>
    <span id="status"></span>
  </div>

  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var playBtn = $('play'), stepBtn = $('step'), resetBtn = $('reset');
      var speedInput = $('speed'), speedValue = $('speedValue'), status = $('status');
      var ready = false;

      // ---- 主题：嵌入在文章里时跟随父页面（Starlight 的 data-theme），单独打开时跟随系统 ----
      function parentRoot() {
        try { return window.parent !== window ? window.parent.document.documentElement : null; }
        catch (e) { return null; }
      }
      function currentTheme() {
        var root = parentRoot();
        if (root && root.dataset.theme) return root.dataset.theme;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      function applyTheme() {
        var theme = currentTheme();
        document.documentElement.dataset.theme = theme;
        if (Module._demo_set_theme) Module._demo_set_theme(theme === 'dark' ? 1 : 0);
      }
      var root = parentRoot();
      if (root) new MutationObserver(applyTheme).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

      // ---- 自适应高度：让父页面的 iframe 正好包住内容 ----
      function fitFrame() {
        try {
          if (window.frameElement) window.frameElement.style.height = document.body.scrollHeight + 'px';
        } catch (e) {}
      }
      new ResizeObserver(fitFrame).observe(document.body);

      // ---- 工具栏 ----
      function speedFromSlider() { return Math.pow(2, Number(speedInput.value)); }
      function formatSpeed(s) { return (s < 1 ? s.toFixed(s < 0.25 ? 3 : 2).replace(/0+$/, '') : s) + '×'; }
      playBtn.onclick = function () { Module._demo_toggle_play(); };
      stepBtn.onclick = function () { Module._demo_step(); };
      resetBtn.onclick = function () { Module._demo_reset(); };
      speedInput.oninput = function () {
        var s = speedFromSlider();
        speedValue.textContent = formatSpeed(s);
        Module._demo_set_speed(s);
      };

      // ---- 不在视口内时暂停主循环 ----
      var visible = true;
      new IntersectionObserver(function (entries) {
        var v = entries[0].isIntersecting;
        if (v === visible) return;
        visible = v;
        if (ready) Module._demo_set_visible(v ? 1 : 0);
      }).observe(document.body);

      window.Module = {
        canvas: $('canvas'),
        print: function (t) { console.log(t); },
        printErr: function (t) { console.warn(t); },
        onRuntimeInitialized: function () {
          applyTheme();
          Module._demo_set_speed(speedFromSlider());
        },
        // 由 C++ 侧（cpp/common/demo.cpp）在状态变化时回调
        onDemoState: function (playing, finished) {
          if (!ready) {
            ready = true;
            $('overlay').hidden = true;
            [playBtn, stepBtn, resetBtn, speedInput].forEach(function (el) { el.disabled = false; });
            if (!visible) Module._demo_set_visible(0);
          }
          playBtn.textContent = playing ? '暂停' : (finished ? '重播' : '播放');
          status.textContent = finished ? '已完成' : (playing ? '运行中' : '已暂停');
        },
      };
      window.addEventListener('error', function () {
        $('overlay').textContent = '演示加载失败：你的浏览器可能不支持 WebGL / WebAssembly';
      });
      applyTheme();
    })();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
